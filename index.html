<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蝦皮購物 | 你的線上購物中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;background:#f5f5f5;color:#222}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

/* ===== Header ===== */
.header{background:linear-gradient(-45deg,#f50057,#ee4d2d);padding:12px 0;position:sticky;top:0;z-index:100}
.header-inner{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;color:#fff;flex-shrink:0}
.logo-icon{width:36px;height:36px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#ee4d2d;font-size:20px}
.logo-text{font-size:20px;font-weight:700;color:#fff}
.search-box{flex:1;display:flex;height:40px;background:#fff;border-radius:4px;overflow:hidden}
.search-box input{flex:1;border:none;outline:none;padding:0 12px;font-size:14px}
.search-btn{width:48px;background:#ee4d2d;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.search-btn svg{width:20px;height:20px;fill:#fff}
.cart{color:#fff;position:relative;cursor:pointer;padding:8px}
.cart svg{width:24px;height:24px;fill:#fff}
.cart-badge{position:absolute;top:0;right:0;background:#fff;color:#ee4d2d;font-size:11px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:18px;text-align:center}

/* ===== Sub-header nav ===== */
.nav{background:#fff;border-bottom:1px solid #eee}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:24px;overflow-x:auto}
.nav a{padding:10px 0;font-size:13px;color:#555;white-space:nowrap}
.nav a:hover{color:#ee4d2d}

/* ===== Flash sale banner ===== */
.banner{max-width:1200px;margin:12px auto;padding:0 16px}
.banner-inner{background:linear-gradient(90deg,#ee4d2d,#f50057);border-radius:8px;padding:20px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.banner-title{font-size:22px;font-weight:800}
.banner-sub{font-size:13px;opacity:.9;margin-top:4px}
.banner-timer{display:flex;gap:6px;align-items:center}
.banner-timer span{background:#fff;color:#ee4d2d;padding:4px 8px;border-radius:4px;font-weight:700;font-size:14px;min-width:36px;text-align:center}

/* ===== Category icons ===== */
.cats{max-width:1200px;margin:12px auto;padding:0 16px}
.cats-row{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.cat{background:#fff;border-radius:8px;padding:12px 4px;text-align:center;cursor:pointer;transition:.2s}
.cat:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cat-icon{width:40px;height:40px;margin:0 auto 6px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.cat-name{font-size:11px;color:#555}

/* ===== Sort bar ===== */
.sort-bar{max-width:1200px;margin:16px auto 8px;padding:0 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sort-label{font-size:14px;color:#666}
.sort-btn{padding:6px 14px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;font-size:13px;color:#333}
.sort-btn.active{background:#ee4d2d;color:#fff;border-color:#ee4d2d}
.sort-btn:hover:not(.active){border-color:#ee4d2d;color:#ee4d2d}
.result-count{margin-left:auto;font-size:13px;color:#999}

/* ===== Product grid ===== */
.grid{max-width:1200px;margin:0 auto;padding:0 16px 32px}
.grid-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.grid-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid-row{grid-template-columns:repeat(2,1fr)}.cats-row{grid-template-columns:repeat(5,1fr)}}

.card{background:#fff;border-radius:4px;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.12);transform:translateY(-2px)}
.card-img{width:100%;aspect-ratio:1;background:#f0f0f0;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-discount{position:absolute;top:8px;right:8px;background:rgba(238,77,45,.9);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px}
.card-body{padding:8px}
.card-name{font-size:13px;line-height:1.4;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:#333}
.card-price{margin-top:6px;display:flex;align-items:baseline;gap:6px}
.card-price-now{color:#ee4d2d;font-size:15px;font-weight:600}
.card-price-orig{color:#999;font-size:12px;text-decoration:line-through}
.card-meta{margin-top:4px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#999}
.card-rating{color:#f5a623}
.official-badge{display:inline-block;background:#ee4d2d;color:#fff;font-size:10px;padding:1px 4px;border-radius:2px;margin-right:4px}
.shop-badge{display:inline-block;background:#fff3e0;color:#ee4d2d;font-size:10px;padding:1px 4px;border:1px solid #ee4d2d;border-radius:2px;margin-right:4px}

/* ===== Pagination ===== */
.pagination{max-width:1200px;margin:0 auto;padding:24px 16px;display:flex;justify-content:center;gap:8px}
.page-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;font-size:14px;color:#555;background:#fff;border:1px solid #ddd}
.page-btn.active{background:#ee4d2d;color:#fff;border-color:#ee4d2d}
.page-btn:hover:not(.active){border-color:#ee4d2d;color:#ee4d2d}

/* ===== Footer ===== */
.footer{background:#fff;border-top:1px solid #eee;padding:24px 16px;text-align:center;font-size:12px;color:#999;line-height:1.8}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">S</div>
      <div class="logo-text">蝦皮購物</div>
    </div>
    <div class="search-box">
      <input type="text" placeholder="搜尋商品、品牌和賣家" value="真皮包包">
      <button class="search-btn">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
    </div>
    <div class="cart">
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45C4.52 15.37 5.48 17 7 17h12v-2H7.42c-.55 0-1-.45-1-1l.12-.24L8.1 14h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 19 5H5.21l-.94-2H1zm16 16c1.1 0 1.99.9 1.99 2s-.89 2-1.99 2-2-.9-2-2 .9-2 2-2z"/></svg>
      <span class="cart-badge">3</span>
    </div>
  </div>
</header>

<!-- Nav -->
<nav class="nav">
  <div class="nav-inner">
    <a href="#">首頁</a><a href="#">免運券</a><a href="#">7天聯運</a><a href="#">商城</a><a href="#">直播</a><a href="#">游戏</a><a href="#">限時特價</a><a href="#">賣家中心</a><a href="#">下載APP</a>
  </div>
</nav>

<!-- Flash Sale Banner -->
<div class="banner">
  <div class="banner-inner">
    <div>
      <div class="banner-title">限時特價</div>
      <div class="banner-sub">每日 0 點、8 點、14 點 整點開搶</div>
    </div>
    <div class="banner-timer">
      <span id="h">02</span>:<span id="m">34</span>:<span id="s">56</span>
    </div>
  </div>
</div>

<!-- Categories -->
<div class="cats">
  <div class="cats-row">
    <div class="cat"><div class="cat-icon" style="background:#ffe0b2">👗</div><div class="cat-name">女裝</div></div>
    <div class="cat"><div class="cat-icon" style="background:#bbdefb">👟</div><div class="cat-name">男鞋</div></div>
    <div class="cat"><div class="cat-icon" style="background:#c8e6c9">👜</div><div class="cat-name">包包</div></div>
    <div class="cat"><div class="cat-icon" style="background:#f8bbd0">💄</div><div class="cat-name">美妝</div></div>
    <div class="cat"><div class="cat-icon" style="background:#d1c4e9">📱</div><div class="cat-name">3C</div></div>
    <div class="cat"><div class="cat-icon" style="background:#fff9c4">🏠</div><div class="cat-name">家居</div></div>
    <div class="cat"><div class="cat-icon" style="background:#b2dfdb">🧸</div><div class="cat-name">母嬰</div></div>
    <div class="cat"><div class="cat-icon" style="background:#ffccbc">⚽</div><div class="cat-name">運動</div></div>
    <div class="cat"><div class="cat-icon" style="background:#e0e0e0">📚</div><div class="cat-name">書籍</div></div>
    <div class="cat"><div class="cat-icon" style="background:#f0f4c3">🚗</div><div class="cat-name">汽車</div></div>
  </div>
</div>

<!-- Sort Bar -->
<div class="sort-bar">
  <span class="sort-label">排序依據：</span>
  <button class="sort-btn active">綜合推薦</button>
  <button class="sort-btn">月銷量</button>
  <button class="sort-btn">最新</button>
  <button class="sort-btn">價格</button>
  <span class="result-count">共 1,234 件商品</span>
</div>

<!-- Product Grid -->
<div class="grid">
  <div class="grid-row" id="grid"></div>
</div>

<!-- Pagination -->
<div class="pagination">
  <div class="page-btn">‹</div>
  <div class="page-btn active">1</div>
  <div class="page-btn">2</div>
  <div class="page-btn">3</div>
  <div class="page-btn">4</div>
  <div class="page-btn">5</div>
  <div class="page-btn">›</div>
</div>

<!-- Footer -->
<footer class="footer">
  © 2026 Shopee Clone Demo · 僅供測試使用<br>
  本頁面為靜態模擬，非真實蝦皮網站
</footer>

<script>
// 模擬商品數據
const products = [
  {name:"全真皮簡約實用零錢包 薄款卡片包",price:299,orig:599,sold:1200,rating:4.9,badge:"shop"},
  {name:"頭層牛皮斜背包 超輕多隔層 肩背包女",price:680,orig:1280,sold:856,rating:4.8},
  {name:"泰國設計師包包 簡約大容量側背包",price:1280,orig:2280,sold:432,rating:5.0,badge:"official"},
  {name:"經典W純色包 摺疊肩背包 真皮背帶",price:980,orig:1680,sold:389,rating:4.7},
  {name:"牛角包 度假包包 大容量側背包iPad包",price:450,orig:890,sold:2300,rating:4.9},
  {name:"TOGO牛皮水桶包 肩背包 斜背包",price:1580,orig:2580,sold:156,rating:4.8},
  {name:"粒面牛皮手提包 小提包 肩背包女",price:880,orig:1580,sold:678,rating:4.6},
  {name:"薄長夾多卡層 全真皮錢包 編號2046",price:350,orig:680,sold:920,rating:4.9},
  {name:"電腦包14吋 頭層牛皮 手提包 筆電包",price:780,orig:1380,sold:445,rating:4.7},
  {name:"三折錢包 短版零錢包 壓花果紋",price:199,orig:399,sold:3100,rating:4.8},
  {name:"帆布托特包 大容量 學生書包 通勤包",price:259,orig:499,sold:5600,rating:4.9},
  {name:"鏈條小包 斜挎包 約會包 小方包",price:420,orig:799,sold:789,rating:4.5},
  {name:"尼龍後背包 防潑水 旅行雙肩包",price:560,orig:980,sold:342,rating:4.6,badge:"shop"},
  {name:"手拿包晚宴包 鑽石紋 派對手拿包",price:320,orig:650,sold:188,rating:4.7},
  {name:"相機包 單肩包 復古牛皮 文藝小包",price:690,orig:1280,sold:267,rating:4.8},
  {name:"腰包胸包 斜挎手機包 運動小包",price:189,orig:359,sold:8900,rating:4.9},
  {name:"大容量購物袋 折疊環保袋 便攜包",price:99,orig:199,sold:12000,rating:4.8},
  {name:"鱷魚紋托特包 上班族包 大容量筆電包",price:720,orig:1280,sold:156,rating:4.5},
  {name:"果凍包透明包 沙灘包 防水游泳包",price:159,orig:299,sold:670,rating:4.6},
  {name:"毛絨絨小包 可愛動物包 兒童女生包",price:129,orig:259,sold:3400,rating:4.9},
];

const grid = document.getElementById('grid');
products.forEach((p,i)=>{
  const discount = Math.round((1-p.price/p.orig)*100);
  const badge = p.badge === 'official' ? '<span class="official-badge">商城</span>' :
                p.badge === 'shop' ? '<span class="shop-badge">優選</span>' : '';
  const hue = (i*37)%360;
  grid.innerHTML += `
    <div class="card">
      <div class="card-img">
        <div style="width:100%;height:100%;background:hsl(${hue},40%,85%);display:flex;align-items:center;justify-content:center;font-size:40px">👜</div>
        ${discount>0?`<span class="card-discount">-${discount}%</span>`:''}
      </div>
      <div class="card-body">
        <div class="card-name">${badge}${p.name}</div>
        <div class="card-price">
          <span class="card-price-now">NT$${p.price}</span>
          <span class="card-price-orig">NT$${p.orig}</span>
        </div>
        <div class="card-meta">
          <span class="card-rating">★ ${p.rating}</span>
          <span>已賣 ${p.sold.toLocaleString()}</span>
        </div>
      </div>
    </div>`;
});

// 倒計時
let sec = 3*3600+34*60+56;
setInterval(()=>{
  sec--;
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor(sec%3600/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  document.getElementById('h').textContent=h;
  document.getElementById('m').textContent=m;
  document.getElementById('s').textContent=s;
},1000);
</script>
</body>
</html>
